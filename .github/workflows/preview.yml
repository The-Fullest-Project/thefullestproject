name: Build and Deploy Preview

# The preview site: a full copy of the site at preview.thefullestproject.org,
# built from the `preview` branch instead of main. Nicole tries changes here
# before they reach the real site.
#
# Deliberately separate from deploy.yml rather than a branch condition inside
# it: the preview must never be able to publish to the live site by accident.
on:
  push:
    branches: [preview]
  workflow_dispatch:

jobs:
  build-and-deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Keep the preview out of Google. Without this it competes with the real
      # site in search results and splits its ranking.
      - name: Block search engines
        run: |
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          find _site -name '*.html' -print0 | xargs -0 sed -i \
            's|<head>|<head><meta name="robots" content="noindex, nofollow">|'

      # The admin portal is NOT shipped to preview. portal.js points at the
      # production worker, so approving, editing or deleting from a preview
      # portal would change the real site — the opposite of what a preview is
      # for. The portal stays production-only until it has its own worker.
      - name: Remove the admin portal
        run: rm -rf _site/admin

      # Distinguish the installed app from the real one, so a phone home screen
      # doesn't end up with two identical icons.
      - name: Label the preview app
        run: |
          sed -i 's|"name": "The Fullest Project"|"name": "The Fullest Project (Preview)"|' _site/manifest.webmanifest
          sed -i 's|"short_name": "Fullest Project"|"short_name": "TFP Preview"|' _site/manifest.webmanifest

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=tfp-preview --branch=preview
