name = "tfp-admin-api"
main = "worker.js"
# The Fullest Project's own Cloudflare account (info@thefullestproject.org), since November 2026.
account_id = "5e7a6fe8095e27a82ccac06681573b49"
compatibility_date = "2026-06-01"

# Secrets (set via `wrangler secret put <NAME>` or the Cloudflare dashboard):
#   GITHUB_TOKEN, GITHUB_REPO, ALLOWED_ORIGIN, ADMIN_KEY,
#   FORMSPREE_SUBMIT_ID, FORMSPREE_NEWSLETTER_ID,
#   BREVO_API_KEY, BREVO_LIST_ID, BREVO_THANKYOU_TEMPLATE_ID, BREVO_DOI_TEMPLATE_ID,
#   BREVO_APPROVED_TEMPLATE_ID   (approval thank-you email; no-ops until set)

# Private submitter-email store for the approval thank-you. Emails NEVER enter
# the public repo — this KV maps a pending submission id to its submitter email
# so the worker can thank them when the item is approved. To activate:
#   npx wrangler kv namespace create SUBMITTER_EMAILS
# then uncomment below with the printed id and redeploy. The code no-ops until then.
# [[kv_namespaces]]
# binding = "SUBMITTER_EMAILS"
# id = "<paste-namespace-id-here>"

# AI-assisted resource search (search.js). Plain settings live here, not in the
# dashboard, so a redeploy can't wipe them. Secrets it needs (dashboard):
#   ANTHROPIC_SEARCH_API_KEY  — the search-only key in the TFP Anthropic Console
#   TURNSTILE_SECRET_KEY      — the Turnstile widget's secret
[vars]
SEARCH_ENABLED = "1"            # "0" turns AI off; the box falls back to keyword search
SEARCH_DAILY_LIMIT = "15"       # AI searches per visitor per day (Nicole, 14 Nov 2026)
SEARCH_DAILY_BUDGET_USD = "1.60" # ≈ $50 a month; keyword search takes over when spent
SEARCH_MODEL = "claude-opus-5-5"
SEARCH_SIGNED_IN_ONLY = "0"     # "1" once accounts launch, if search moves to signed-in visitors

# Daily search counts and the per-visitor counter (never what people type).
# Created 14 Nov 2026 with: npx wrangler kv namespace create SEARCH_STATS
[[kv_namespaces]]
binding = "SEARCH_STATS"
id = "6e5b4310d5fa4e8b9273cfe374d0792c"

# Change-request log (C5). Private on purpose: the repo is public on GitHub and
# Nicole asked for this list to stay inside the review portal.
[[kv_namespaces]]
binding = "CHANGE_REQUESTS"
id = "0203b33700e44cae9b0f28cee9f74a5a"
